    - variables:
        pname: '{{ states(''input_text.inkbird_name_1'') }}'
        ptemp: '{{ states(''sensor.bbq_probe_1_control_temperature'') | float(0) | round(1) }}'
        italian: '{{ is_state(''input_select.bbq_language'', ''Italiano'') }}'
    - action: script.bbq_notify
