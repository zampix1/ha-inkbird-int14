# Optional INT-14-BW / IHT-2PB Cook Control package. See ../README.md.
inkbird_cook_control:

input_text:
  inkbird_sensor_prefix:
    name: Inkbird sensor prefix
    icon: mdi:identifier
    max: 120
    pattern: sensor\.[a-z0-9_]+
  inkbird_name_1:
    name: Probe 1 name
    max: 100
  inkbird_name_2:
    name: Probe 2 name
    max: 100
  inkbird_name_3:
    name: Probe 3 name
    max: 100
  inkbird_name_4:
    name: Probe 4 name
    max: 100
  bbq_custom_name:
    name: BBQ custom recipe name
    icon: mdi:pencil
    max: 100
  bbq_notify_service:
    name: BBQ notify service
    icon: mdi:cellphone-message
    max: 100
    pattern: '[a-z0-9_]*'
  bbq_tv_notify_service:
    name: BBQ TV notify service
    icon: mdi:television
    max: 100
    pattern: '[a-z0-9_]*'
  bbq_tv_entity:
    name: BBQ TV media player
    icon: mdi:television
    max: 100
  bbq_alexa_group_name:
    name: BBQ Alexa announcement group name
    max: 80
  bbq_alexa_group_targets:
    name: BBQ Alexa announcement group speakers (comma separated)
    max: 255
  bbq_saved_tts_speaker:
    name: BBQ remembered announcement speaker
    max: 100
  bbq_last_alert_1:
    name: Probe 1 last alert session
    max: 255
  bbq_last_alert_2:
    name: Probe 2 last alert session
    max: 255
  bbq_last_alert_3:
    name: Probe 3 last alert session
    max: 255
  bbq_last_alert_4:
    name: Probe 4 last alert session
    max: 255
input_number:
  inkbird_target_1:
    name: Probe 1 target
    icon: mdi:thermometer-alert
    min: 0
    max: 300
    step: 1
    unit_of_measurement: °C
    mode: slider
  inkbird_target_2:
    name: Probe 2 target
    icon: mdi:thermometer-alert
    min: 0
    max: 300
    step: 1
    unit_of_measurement: °C
    mode: slider
  inkbird_target_3:
    name: Probe 3 target
    icon: mdi:thermometer-alert
    min: 0
    max: 300
    step: 1
    unit_of_measurement: °C
    mode: slider
  inkbird_target_4:
    name: Probe 4 target
    icon: mdi:thermometer-alert
    min: 0
    max: 300
    step: 1
    unit_of_measurement: °C
    mode: slider
  bbq_battery_threshold:
    name: BBQ battery alert threshold
    icon: mdi:battery-alert-variant-outline
    min: 5
    max: 50
    step: 1
    unit_of_measurement: '%'
    mode: slider
  bbq_custom_target:
    name: BBQ custom recipe target
    icon: mdi:thermometer-alert
    min: 0
    max: 300
    step: 1
    unit_of_measurement: °C
    mode: slider
  bbq_rest_minutes:
    name: BBQ rest reminder
    icon: mdi:timer-sand
    min: 0
    max: 120
    step: 5
    unit_of_measurement: min
    mode: slider
  bbq_snooze_minutes:
    name: BBQ snooze duration
    icon: mdi:alarm-snooze
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider
  bbq_graph_max:
    name: BBQ graph top temperature
    icon: mdi:chart-line-variant
    min: 100
    max: 300
    step: 10
    unit_of_measurement: °C
    mode: slider
input_boolean:
  bbq_battery_alerts:
    name: BBQ battery alerts
    icon: mdi:battery-alert
  bbq_stall_alerts:
    name: BBQ stall alerts
    icon: mdi:trending-neutral
  bbq_tts_alerts:
    name: BBQ spoken announcements
    icon: mdi:bullhorn
  bbq_tv_alerts:
    name: BBQ TV text notifications
    icon: mdi:television
  bbq_show_help:
    name: BBQ show help
    icon: mdi:help-circle-outline
  bbq_custom_open:
    name: BBQ custom recipe open
    icon: mdi:tune-variant
  bbq_probe_1_enabled:
    name: Probe 1 alerts
    icon: mdi:bell-outline
  bbq_probe_2_enabled:
    name: Probe 2 alerts
    icon: mdi:bell-outline
  bbq_probe_3_enabled:
    name: Probe 3 alerts
    icon: mdi:bell-outline
  bbq_probe_4_enabled:
    name: Probe 4 alerts
    icon: mdi:bell-outline
input_select:
  inkbird_dashboard_model:
    name: Inkbird dashboard model
    icon: mdi:devices
    options:
    - INT-14-BW
    - IHT-2PB
  inkbird_active_probe:
    name: Active probe
    icon: mdi:target
    options:
    - '1'
    - '2'
    - '3'
    - '4'
  inkbird_unit:
    name: Temperature unit
    icon: mdi:thermometer
    options:
    - °C
    - °F
  bbq_accent:
    name: BBQ accent colour
    icon: mdi:palette
    options:
    - Ember
    - Blue
    - Green
    - Purple
    - Red
    - Teal
  bbq_tts_speaker:
    name: BBQ TTS speaker
    icon: mdi:speaker
    options:
    - none
  bbq_tts_engine:
    name: BBQ TTS engine
    icon: mdi:text-to-speech
    options:
    - none
    - Alexa (native)
  bbq_style:
    name: BBQ dashboard style
    icon: mdi:palette-outline
    options:
    - Default
    - Transparent
  bbq_notify_target:
    name: BBQ notification target
    icon: mdi:bell-ring
    options:
    - persistent_notification
  bbq_language:
    name: Cook Control language
    options:
    - English
    - Italiano
    icon: mdi:translate
sensor:
- platform: derivative
  name: BBQ Probe 1 Rate
  unique_id: bbq_probe_1_rate
  source: sensor.bbq_probe_1_control_temperature
  unit_time: h
  time_window: 00:10:00
  max_sub_interval: 00:02:00
  round: 1
- platform: derivative
  name: BBQ Probe 2 Rate
  unique_id: bbq_probe_2_rate
  source: sensor.bbq_probe_2_control_temperature
  unit_time: h
  time_window: 00:10:00
  max_sub_interval: 00:02:00
  round: 1
- platform: derivative
  name: BBQ Probe 3 Rate
  unique_id: bbq_probe_3_rate
  source: sensor.bbq_probe_3_control_temperature
  unit_time: h
  time_window: 00:10:00
  max_sub_interval: 00:02:00
  round: 1
- platform: derivative
  name: BBQ Probe 4 Rate
  unique_id: bbq_probe_4_rate
  source: sensor.bbq_probe_4_control_temperature
  unit_time: h
  time_window: 00:10:00
  max_sub_interval: 00:02:00
  round: 1
template:
- sensor:
  - name: BBQ Probe 1 Control Temperature
    unique_id: bbq_probe_1_control_temperature
    device_class: temperature
    unit_of_measurement: °C
    availability: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_built_in_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_1_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if states[p ~ '_built_in_temperature'] is not none else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {{ p | regex_match('^sensor[.][a-z0-9_]+$') and is_number(states(e)) and newest > 0 and -60 <= as_timestamp(now()) - newest <= 120 }}
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_built_in_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_1_internal_temperature') %}
      {% set v = states(e) | float(none) %}
      {{ ((v - 32) * 5 / 9 if state_attr(e, 'unit_of_measurement') == '°F' else v) if is_number(states(e)) else none }}
    attributes:
      source_prefix: "{{ states('input_text.inkbird_sensor_prefix') }}"
      source_entity: |-
        {% set p = states('input_text.inkbird_sensor_prefix') %}
        {{ p ~ ('_built_in_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_1_internal_temperature') }}
      # Derivative buffers survive unavailable input. Consumers must ignore them
      # for a full 10-minute window plus the 2-minute recalculation interval.
      rate_valid_after: &bbq_rate_valid_after |-
        {% set p = states['input_text.inkbird_sensor_prefix'] %}
        {{ as_timestamp(p.last_changed) + 720 if p is not none else none }}
  - name: BBQ Probe 2 Control Temperature
    unique_id: bbq_probe_2_control_temperature
    device_class: temperature
    unit_of_measurement: °C
    availability: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_external_1_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_2_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if states[p ~ '_built_in_temperature'] is not none else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {{ p | regex_match('^sensor[.][a-z0-9_]+$') and is_number(states(e)) and newest > 0 and -60 <= as_timestamp(now()) - newest <= 120 }}
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_external_1_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_2_internal_temperature') %}
      {% set v = states(e) | float(none) %}
      {{ ((v - 32) * 5 / 9 if state_attr(e, 'unit_of_measurement') == '°F' else v) if is_number(states(e)) else none }}
    attributes:
      source_prefix: "{{ states('input_text.inkbird_sensor_prefix') }}"
      source_entity: |-
        {% set p = states('input_text.inkbird_sensor_prefix') %}
        {{ p ~ ('_external_1_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_2_internal_temperature') }}
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Probe 3 Control Temperature
    unique_id: bbq_probe_3_control_temperature
    device_class: temperature
    unit_of_measurement: °C
    availability: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_external_2_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_3_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if states[p ~ '_built_in_temperature'] is not none else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {{ p | regex_match('^sensor[.][a-z0-9_]+$') and is_number(states(e)) and newest > 0 and -60 <= as_timestamp(now()) - newest <= 120 }}
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ ('_external_2_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_3_internal_temperature') %}
      {% set v = states(e) | float(none) %}
      {{ ((v - 32) * 5 / 9 if state_attr(e, 'unit_of_measurement') == '°F' else v) if is_number(states(e)) else none }}
    attributes:
      source_prefix: "{{ states('input_text.inkbird_sensor_prefix') }}"
      source_entity: |-
        {% set p = states('input_text.inkbird_sensor_prefix') %}
        {{ p ~ ('_external_2_temperature' if states[p ~ '_built_in_temperature'] is not none else '_probe_3_internal_temperature') }}
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Probe 4 Control Temperature
    unique_id: bbq_probe_4_control_temperature
    device_class: temperature
    unit_of_measurement: °C
    availability: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ '_probe_4_internal_temperature' %}
      {% set newest = [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {{ p | regex_match('^sensor[.][a-z0-9_]+$') and states[p ~ '_built_in_temperature'] is none and is_number(states(e)) and newest > 0 and -60 <= as_timestamp(now()) - newest <= 120 }}
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ '_probe_4_internal_temperature' %}
      {% set v = states(e) | float(none) %}
      {{ ((v - 32) * 5 / 9 if state_attr(e, 'unit_of_measurement') == '°F' else v) if states[p ~ '_built_in_temperature'] is none and is_number(states(e)) else none }}
    attributes:
      source_prefix: "{{ states('input_text.inkbird_sensor_prefix') }}"
      source_entity: |-
        {% set p = states('input_text.inkbird_sensor_prefix') %}
        {{ p ~ '_probe_4_internal_temperature' if states[p ~ '_built_in_temperature'] is none else none }}
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Alert Count
    unique_id: bbq_alert_count
    state: |
      {{ ['1', '2', '3', '4']
         | map('regex_replace', '^(.*)$', 'sensor.bbq_probe_\\1_status')
         | map('states')
         | select('in', ['close', 'ready'])
         | list | count }}
  - name: BBQ Probe 1 Status
    unique_id: bbq_probe_1_status
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set iht = states[p ~ '_built_in_temperature'] is not none %}
      {% set e = p ~ ('_built_in_temperature' if iht else '_probe_1_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if iht else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {% set age = as_timestamp(now()) - newest %}
      {% set t = states('sensor.bbq_probe_1_control_temperature') | float(none) %}
      {% set g = states('input_number.inkbird_target_1') | float(none) %}
      {% if not is_state('input_boolean.bbq_probe_1_enabled', 'on') %}idle
      {% elif not p | regex_match('^sensor[.][a-z0-9_]+$') or state_attr('sensor.bbq_probe_1_control_temperature', 'source_prefix') != p or state_attr('sensor.bbq_probe_1_control_temperature', 'source_entity') != e %}idle
      {% elif not is_number(states(e)) or newest <= 0 or age < -60 or age > 120 or not is_number(t) or not is_number(g) or g <= 0 %}idle
      {% elif t >= g %}ready
      {% elif t >= g - 5 %}close
      {% else %}heating{% endif %}
    attributes:
      source_prefix: "{{ state_attr('sensor.bbq_probe_1_control_temperature', 'source_prefix') }}"
      source_entity: "{{ state_attr('sensor.bbq_probe_1_control_temperature', 'source_entity') }}"
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Probe 2 Status
    unique_id: bbq_probe_2_status
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set iht = states[p ~ '_built_in_temperature'] is not none %}
      {% set e = p ~ ('_external_1_temperature' if iht else '_probe_2_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if iht else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {% set age = as_timestamp(now()) - newest %}
      {% set t = states('sensor.bbq_probe_2_control_temperature') | float(none) %}
      {% set g = states('input_number.inkbird_target_2') | float(none) %}
      {% if not is_state('input_boolean.bbq_probe_2_enabled', 'on') %}idle
      {% elif not p | regex_match('^sensor[.][a-z0-9_]+$') or state_attr('sensor.bbq_probe_2_control_temperature', 'source_prefix') != p or state_attr('sensor.bbq_probe_2_control_temperature', 'source_entity') != e %}idle
      {% elif not is_number(states(e)) or newest <= 0 or age < -60 or age > 120 or not is_number(t) or not is_number(g) or g <= 0 %}idle
      {% elif t >= g %}ready
      {% elif t >= g - 5 %}close
      {% else %}heating{% endif %}
    attributes:
      source_prefix: "{{ state_attr('sensor.bbq_probe_2_control_temperature', 'source_prefix') }}"
      source_entity: "{{ state_attr('sensor.bbq_probe_2_control_temperature', 'source_entity') }}"
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Probe 3 Status
    unique_id: bbq_probe_3_status
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set iht = states[p ~ '_built_in_temperature'] is not none %}
      {% set e = p ~ ('_external_2_temperature' if iht else '_probe_3_internal_temperature') %}
      {% set newest = states(p ~ '_last_update_epoch') | float(0) if iht else [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {% set age = as_timestamp(now()) - newest %}
      {% set t = states('sensor.bbq_probe_3_control_temperature') | float(none) %}
      {% set g = states('input_number.inkbird_target_3') | float(none) %}
      {% if not is_state('input_boolean.bbq_probe_3_enabled', 'on') %}idle
      {% elif not p | regex_match('^sensor[.][a-z0-9_]+$') or state_attr('sensor.bbq_probe_3_control_temperature', 'source_prefix') != p or state_attr('sensor.bbq_probe_3_control_temperature', 'source_entity') != e %}idle
      {% elif not is_number(states(e)) or newest <= 0 or age < -60 or age > 120 or not is_number(t) or not is_number(g) or g <= 0 %}idle
      {% elif t >= g %}ready
      {% elif t >= g - 5 %}close
      {% else %}heating{% endif %}
    attributes:
      source_prefix: "{{ state_attr('sensor.bbq_probe_3_control_temperature', 'source_prefix') }}"
      source_entity: "{{ state_attr('sensor.bbq_probe_3_control_temperature', 'source_entity') }}"
      rate_valid_after: *bbq_rate_valid_after
  - name: BBQ Probe 4 Status
    unique_id: bbq_probe_4_status
    state: |-
      {% set p = states('input_text.inkbird_sensor_prefix') %}
      {% set e = p ~ '_probe_4_internal_temperature' %}
      {% set newest = [states(p ~ '_last_ble_update_epoch') | float(0), states(p ~ '_last_lan_update_epoch') | float(0)] | max %}
      {% set age = as_timestamp(now()) - newest %}
      {% set t = states('sensor.bbq_probe_4_control_temperature') | float(none) %}
      {% set g = states('input_number.inkbird_target_4') | float(none) %}
      {% if not is_state('input_boolean.bbq_probe_4_enabled', 'on') %}idle
      {% elif states[p ~ '_built_in_temperature'] is not none or not p | regex_match('^sensor[.][a-z0-9_]+$') or state_attr('sensor.bbq_probe_4_control_temperature', 'source_prefix') != p or state_attr('sensor.bbq_probe_4_control_temperature', 'source_entity') != e %}idle
      {% elif not is_number(states(e)) or newest <= 0 or age < -60 or age > 120 or not is_number(t) or not is_number(g) or g <= 0 %}idle
      {% elif t >= g %}ready
      {% elif t >= g - 5 %}close
      {% else %}heating{% endif %}
    attributes:
      source_prefix: "{{ state_attr('sensor.bbq_probe_4_control_temperature', 'source_prefix') }}"
      source_entity: "{{ state_attr('sensor.bbq_probe_4_control_temperature', 'source_entity') }}"
      rate_valid_after: *bbq_rate_valid_after
script:
  bbq_select_thermometer:
    alias: BBQ select thermometer
    icon: mdi:thermometer
    mode: restart
    fields:
      prefix:
        name: Sensor prefix
        required: true
        selector:
          text: null
    sequence:
    - condition: template
      value_template: |-
        {% if prefix is string and prefix | regex_match('^sensor[.][a-z0-9_]+$') %}
          {% set iht = states[prefix ~ '_built_in_temperature'] is not none %}
          {% set suffixes = ['_built_in_temperature', '_external_1_temperature', '_external_2_temperature'] if iht else ['_probe_1_internal_temperature', '_probe_2_internal_temperature', '_probe_3_internal_temperature', '_probe_4_internal_temperature'] %}
          {% set valid = namespace(value=true) %}
          {% set profile = states(prefix ~ '_configured_model_profile') %}
          {% if not iht and profile not in ['unknown', 'unavailable', '', 'int14_bw'] %}{% set valid.value = false %}{% endif %}
          {% for suffix in suffixes %}
            {% if states[prefix ~ suffix] is none %}{% set valid.value = false %}{% endif %}
          {% endfor %}
          {{ valid.value }}
        {% else %}false{% endif %}
    - condition: template
      value_template: "{{ prefix != states('input_text.inkbird_sensor_prefix') }}"
    # Compatibility view selector only. Per-device settings live in the backend.
    - action: input_text.set_value
      target:
        entity_id: input_text.inkbird_sensor_prefix
      data:
        value: '{{ prefix }}'
  bbq_reset_cook:
    alias: BBQ reset selected cook
    mode: restart
    sequence:
    - if: "{{ has_value('sensor.inkbird_cook_control') }}"
      then:
      - stop: Use Cook Control finish with explicit device_id. Legacy helpers are not active cooks.
        error: true
    - variables:
        prefix: '{{ states("input_text.inkbird_sensor_prefix") }}'
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.bbq_probe_1_enabled
        - input_boolean.bbq_probe_2_enabled
        - input_boolean.bbq_probe_3_enabled
        - input_boolean.bbq_probe_4_enabled
    - action: script.turn_off
      target:
        entity_id:
        - script.bbq_snooze_1
        - script.bbq_rest_1
        - script.bbq_snooze_2
        - script.bbq_rest_2
        - script.bbq_snooze_3
        - script.bbq_rest_3
        - script.bbq_snooze_4
        - script.bbq_rest_4
    - action: input_text.set_value
      target:
        entity_id:
        - input_text.bbq_last_alert_1
        - input_text.bbq_last_alert_2
        - input_text.bbq_last_alert_3
        - input_text.bbq_last_alert_4
      data:
        value: ''
    - action: input_number.set_value
      target:
        entity_id:
        - input_number.inkbird_target_1
        - input_number.inkbird_target_2
        - input_number.inkbird_target_3
        - input_number.inkbird_target_4
      data:
        value: 0
    - variables:
        iht: '{{ states[prefix ~ "_built_in_temperature"] is not none }}'
    - repeat:
        count: 4
        sequence:
        - action: input_text.set_value
          target:
            entity_id: input_text.inkbird_name_{{ repeat.index }}
          data:
            value: '{{ ["Built-in", "External 1", "External 2", "Unavailable"][repeat.index - 1] if iht else "Probe " ~ repeat.index }}'
    - action: input_select.set_options
      target:
        entity_id: input_select.inkbird_active_probe
      data:
        options: '{{ ["1", "2", "3"] if iht else ["1", "2", "3", "4"] }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.inkbird_active_probe
      data:
        option: '1'
    - action: input_select.select_option
      target:
        entity_id: input_select.inkbird_dashboard_model
      data:
        option: '{{ "IHT-2PB" if iht else "INT-14-BW" }}'
  inkbird_apply_recipe:
    alias: Inkbird — apply recipe to active probe
    icon: mdi:silverware-fork-knife
    mode: parallel
    max: 10
    fields:
      label:
        name: Label
        description: Display name written to the probe (e.g. "Beef Brisket").
        required: true
        selector:
          text: null
      target:
        name: Target
        description: Target temperature in °C.
        required: true
        selector:
          number:
            min: 0
            max: 300
            unit_of_measurement: °C
    sequence:
    - if: "{{ has_value('sensor.inkbird_cook_control') }}"
      then:
      - stop: Use Cook Control configure with explicit device_id and channel. No settings were changed.
        error: true
    - variables:
        probe: '{{ states(''input_select.inkbird_active_probe'') }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.inkbird_target_{{ probe }}
      data:
        value: '{{ target | float }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.inkbird_name_{{ probe }}
      data:
        value: '{{ label }}'
  inkbird_apply_custom_recipe:
    alias: Inkbird — apply the custom recipe
    icon: mdi:tune-variant
    mode: single
    sequence:
    - if: "{{ has_value('sensor.inkbird_cook_control') }}"
      then:
      - stop: Apply the saved preset from Cook Control to an explicit thermometer and probe.
        error: true
    - variables:
        label: |
          {% set n = states('input_text.bbq_custom_name') %} {{ n if n not in ['unknown', 'unavailable', ''] else 'Custom' }}
    - action: script.inkbird_apply_recipe
      data:
        label: '{{ label }}'
        target: '{{ states(''input_number.bbq_custom_target'') | float(60) }}'
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.bbq_custom_open
  bbq_refresh_media_targets:
    alias: BBQ — refresh TTS device lists
    icon: mdi:refresh
    mode: single
    sequence:
    - action: input_select.set_options
      target:
        entity_id: input_select.bbq_tts_speaker
      data:
        options: |
          {% set selected = states('input_select.bbq_tts_speaker') %} {% set available = states.media_player
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='entity_id') | list %}
          {% set group_name = states('input_text.bbq_alexa_group_name') %}
          {% set group = [group_name] if group_name not in ['unknown', 'unavailable', ''] and states('input_text.bbq_alexa_group_targets') not in ['unknown', 'unavailable', ''] else [] %}
          {% set saved = states('input_text.bbq_saved_tts_speaker') %}
          {% set retained = [selected] if selected is match('^media_player[.][a-z0-9_]+$') else [] %}
          {% set remembered = [saved] if saved is match('^media_player[.][a-z0-9_]+$') else [] %}
          {{ ['none'] + ((available + retained + remembered + group) | unique | sort) }}
    - action: input_select.set_options
      target:
        entity_id: input_select.bbq_tts_engine
      data:
        options: |
          {% set selected = states('input_select.bbq_tts_engine') %} {% set native = ['Alexa (native)'] if integration_entities('alexa_media') | count > 0 or selected == 'Alexa (native)' else [] %} {% set available = states.tts | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='entity_id') | list %}
          {% set retained = [selected] if selected is match('^tts[.][a-z0-9_]+$') else [] %} {{ ['none'] + native + ((available + retained) | unique | sort) }}
  bbq_notify:
    alias: BBQ send a notification
    icon: mdi:bell-ring-outline
    mode: parallel
    max: 25
    fields:
      title:
        name: Title
        required: true
        selector:
          text: null
      message:
        name: Message
        required: true
        selector:
          text: null
      tag:
        name: Tag
        description: |
          Notification id. Re-using a tag replaces the previous notification instead of stacking another one up.
        required: true
        selector:
          text: null
      actions:
        name: Actions
        description: Optional mobile_app action buttons.
        required: false
        selector:
          object: null
      tts_message:
        name: Spoken message
        description: |
          What the speaker says. Falls back to `message`. Worth setting separately — emoji and "°C" do not read well out loud.
        required: false
        selector:
          text: null
    sequence:
    - action: persistent_notification.create
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        notification_id: '{{ tag }}'
    - variables:
        notify_target: |
          {% set configured = states('input_text.bbq_notify_service') %} {{ configured if configured not in ['unknown', 'unavailable', '']
             else states('input_select.bbq_notify_target') }}
    - if:
      - condition: template
        value_template: |
          {{ notify_target not in ['persistent_notification', 'unknown', 'unavailable', '']
             and notify_target | regex_match('^[a-z0-9_]+$') }}
      then:
      - choose:
        - conditions: '{{ notify_target.startswith(''mobile_app_'') }}'
          sequence:
          - action: '{{ ''notify.'' ~ notify_target }}'
            continue_on_error: true
            data:
              title: '{{ title }}'
              message: '{{ message }}'
              data:
                tag: '{{ tag }}'
                actions: '{{ actions | default([], true) }}'
        default:
        - action: '{{ ''notify.'' ~ notify_target }}'
          continue_on_error: true
          data:
            title: '{{ title }}'
            message: '{{ message }}'
    - if:
      - condition: state
        entity_id: input_boolean.bbq_tv_alerts
        state: 'on'
      then:
      - variables:
          tv_service: '{{ states(''input_text.bbq_tv_notify_service'') }}'
          tv_entity: '{{ states(''input_text.bbq_tv_entity'') }}'
      - choose:
        - conditions: |
            {{ tv_service | regex_match('^[a-z0-9_]+$')
               and tv_entity | regex_match('^media_player\\.[a-z0-9_]+$')
               and has_value(tv_entity) }}
          sequence:
          - if: '{{ not is_state(tv_entity, ''off'') }}'
            then:
            - action: '{{ ''notify.'' ~ tv_service }}'
              continue_on_error: true
              data:
                message: '{{ title }}: {{ message }}'
        default:
        - action: persistent_notification.create
          data:
            notification_id: inkbird_tv_configuration
            title: BBQ TV notification unavailable
            message: Check the TV notify service and media player in the dashboard settings.
    - if:
      - condition: state
        entity_id: input_boolean.bbq_tts_alerts
        state: 'on'
      then:
      - variables:
          speaker: '{{ states(''input_select.bbq_tts_speaker'') }}'
          engine: '{{ states(''input_select.bbq_tts_engine'') }}'
          alexa_speaker: '{{ states(''input_select.bbq_tts_speaker'') in integration_entities(''alexa_media'') }}'
          alexa_targets: >-
            {% set configured = states('input_text.bbq_alexa_group_targets').split(',') | map('trim') | list %}
            {% set valid = namespace(value=true, targets=[]) %}
            {% for entity in configured %}
              {% if not entity is match('^media_player[.][a-z0-9_]+$') or entity not in integration_entities('alexa_media') %}{% set valid.value = false %}
              {% elif has_value(entity) %}{% set valid.targets = valid.targets + [entity] %}{% endif %}
            {% endfor %}
            {{ valid.targets if valid.value else [] }}
          alexa_group: >-
            {{ states('input_select.bbq_tts_speaker') == states('input_text.bbq_alexa_group_name') and alexa_targets | count > 0 }}
      - choose:
        - conditions: '{{ engine == ''none'' or speaker == ''none'' }}'
          sequence:
          - stop: Speech disabled by the device selector.
        - conditions: |
            {{ engine == 'Alexa (native)' and ((alexa_speaker and has_value(speaker)) or alexa_group | default(false)) }}
          sequence:
          - action: notify.alexa_media
            data:
              target: '{{ alexa_targets if alexa_group | default(false) else [speaker] }}'
              title: '{{ title }}'
              message: '{{ tts_message | default(message, true) }}'
              data:
                type: announce
                method: speak
        - conditions: |
            {{ engine.startswith('tts.') and has_value(engine)
               and has_value(speaker) and not alexa_speaker
               and not is_state(speaker, 'off')
               and (state_attr(speaker, 'supported_features') | int(0) | bitwise_and(512)) != 0 }}
          sequence:
          - action: tts.speak
            target:
              entity_id: '{{ engine }}'
            data:
              media_player_entity_id: '{{ speaker }}'
              cache: true
              message: '{{ tts_message | default(message, true) }}'
        default:
        - action: persistent_notification.create
          data:
            notification_id: inkbird_audio_configuration
            title: BBQ announcement not sent
            message: |
              The selected speaker or voice engine is unavailable or incompatible. For an Alexa Media Player speaker, choose Alexa (native). Other players need an available TTS engine and audio playback support.
        - stop: Invalid BBQ speech configuration.
          error: true
  bbq_snooze_1:
    alias: BBQ probe 1 snooze
    mode: restart
    sequence:
    - variables:
        session_at_start: '{{ [as_timestamp(states.input_boolean.bbq_probe_1_enabled.last_changed), as_timestamp(states.input_text.inkbird_name_1.last_changed),
          as_timestamp(states.input_number.inkbird_target_1.last_changed), as_timestamp(states.input_text.inkbird_sensor_prefix.last_changed)]
          | join('':'') }}'
        minutes: '{{ states(''input_number.bbq_snooze_minutes'') | int(0) }}'
    - condition: template
      value_template: '{{ minutes > 0 }}'
    - delay:
        minutes: '{{ minutes }}'
    - variables:
        current_session: '{{ [as_timestamp(states.input_boolean.bbq_probe_1_enabled.last_changed), as_timestamp(states.input_text.inkbird_name_1.last_changed),
          as_timestamp(states.input_number.inkbird_target_1.last_changed), as_timestamp(states.input_text.inkbird_sensor_prefix.last_changed)]
          | join('':'') }}'
    - condition: template
      value_template: '{{ current_session == session_at_start and is_state(''sensor.bbq_probe_1_status'', ''ready'')
        and is_state(''input_boolean.bbq_probe_1_enabled'', ''on'') and state_attr(''sensor.bbq_probe_1_status'', ''source_prefix'') == states(''input_text.inkbird_sensor_prefix'') and state_attr(''sensor.bbq_probe_1_control_temperature'', ''source_prefix'') == states(''input_text.inkbird_sensor_prefix'') }}'
    - variables:
        pname: '{{ states(''input_text.inkbird_name_1'') }}'
        ptemp: '{{ states(''sensor.bbq_probe_1_control_temperature'') | float(0) | round(1) }}'
        italian: '{{ is_state(''input_select.bbq_language'', ''Italiano'') }}'
    - action: script.bbq_notify
      data:
        title: '{{ ''BBQ: promemoria'' if italian else ''BBQ: reminder'' }}'
        message: '{{ pname }}: {{ ''soglia ancora raggiunta'' if italian else ''still at the HA target'' }}. {{
          ptemp }} {{ ''gradi'' if italian else ''degrees'' }}.'
        tag: inkbird_ready_1
